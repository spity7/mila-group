# Prerequisites:
#   1. cp .env.example .env
#   2. docker compose up --build
#
# Toggle local/production by commenting/uncommenting lines in .env

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.milagroupco.com/api/v1/}
    ports:
      - "127.0.0.1:3010:3010"
    restart: unless-stopped
